[project]
name = "easyastroenhance"
version = "1.0.0"
description = "Local, deterministic enhancement of telescope photographs (JPEG, TIFF, stacked FITS)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "numpy",
    "scipy",
    "pillow",
    "tifffile",
    "imagecodecs",
    "astropy",
    "psutil",
    # Optional AI tools (opt-in per run): ONNX inference of third-party models. DirectML runs on any DirectX 12 GPU.
    "onnxruntime-directml; sys_platform == 'win32'",
    "onnxruntime; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Installed only by scripts/setup-gpu.ps1. CPU-only installs never touch this extra.
gpu = ["cupy-cuda13x[ctk]"]

[dependency-groups]
dev = ["pytest", "httpx", "onnx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "gpu: requires a working NVIDIA CUDA device (skipped otherwise)",
    "realfiles: requires user-provided real images in samplepics/ or EAE_SEESTAR_DIR (skipped otherwise)",
    "aimodels: requires the downloaded AI models in the app data folder or EAE_AI_MODELS_DIR (skipped otherwise)",
]
filterwarnings = ["ignore::DeprecationWarning"]

